syntax = "proto3";

package protocolbench;

option java_multiple_files = true;
option java_package = "br.com.diegobraun.protocolbench.api.grpc";

message Product {
  int64 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  string category = 5;
  repeated string tags = 6;
  int32 stock = 7;
  string created_at = 8;
}

message GetProductRequest {
  int64 id = 1;
}

message ListProductsRequest {
  int32 limit = 1;
}

message ProductList {
  repeated Product products = 1;
}

message StreamProductsRequest {
  int32 count = 1;
}

message UploadSummary {
  int32 accepted = 1;
  int32 rejected = 2;
  double total_value = 3;
  string uploaded_by = 4;
}

message PriceQuoteRequest {
  int64 product_id = 1;
  int32 quantity = 2;
}

message PriceQuote {
  int64 product_id = 1;
  int32 quantity = 2;
  double unit_price = 3;
  double total = 4;
  bool in_stock = 5;
}

service ProductService {
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc ListProducts(ListProductsRequest) returns (ProductList);
  rpc StreamProducts(StreamProductsRequest) returns (stream Product);
  rpc UploadProducts(stream Product) returns (UploadSummary);
  rpc QuotePrices(stream PriceQuoteRequest) returns (stream PriceQuote);
}
