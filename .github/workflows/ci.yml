name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - name: Smoke benchmark
        run: ./run-benchmark.sh --concurrency=4 --warmup=1s --duration=2s --out=ci-results
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: ci-results/
